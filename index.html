<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloudflare Status</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>body{background:#f5f7fb;color:#172033}.shell{max-width:1500px;margin:auto}.card{background:#fff;border:1px solid #e8edf5;border-radius:18px;box-shadow:0 8px 30px #3341550d}.metric{padding:18px;border-radius:15px;background:linear-gradient(135deg,#fff,#f8fafc);border:1px solid #edf1f6}.metric b{font-size:28px}.tab{white-space:nowrap;padding:11px 17px;border-radius:11px;color:#64748b;font-weight:700}.tab.active{background:#1e293b;color:white}.tab:hover{background:#eef2f7}.tab.active:hover{background:#1e293b}.chart{height:330px}.bar{height:9px;border-radius:99px;background:#e8edf5;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#06b6d4)}.hidden{display:none!important}@media(max-width:700px){.shell{padding:10px}.chart{height:270px}}</style></head>
<body><div class="shell p-5">
<header class="card p-5 mb-4"><div class="flex flex-col lg:flex-row gap-4 lg:items-center justify-between"><div><div class="text-xs font-bold text-blue-600">CLOUDFLARE ACCOUNT MONITOR</div><h1 id="title" class="text-3xl font-black mt-1">Cloudflare Status</h1><p class="text-slate-500 mt-1">按页签加载 · 指标独立失败 · 不再打开页面全量请求</p></div><div class="flex gap-2 flex-wrap"><select id="days" class="border rounded-xl px-3 py-2"><option value="1">最近 1 天</option><option value="7" selected>最近 7 天</option><option value="30">最近 30 天</option></select><select id="zone" class="border rounded-xl px-3 py-2 max-w-xs"><option value="">选择 Zone</option></select><button id="refresh" class="bg-slate-900 text-white px-4 py-2 rounded-xl font-bold">刷新当前页</button></div></div>
<div class="overflow-x-auto mt-5"><nav id="tabs" class="flex gap-1 min-w-max">
<button class="tab active" data-tab="overview">总览</button><button class="tab" data-tab="zone">网站 / Zone</button><button class="tab" data-tab="workers">Workers</button><button class="tab" data-tab="d1">D1</button><button class="tab" data-tab="kv">KV</button><button class="tab" data-tab="r2">R2</button><button class="tab" data-tab="do">Durable Objects</button><button class="tab" data-tab="security">安全</button><button class="tab" data-tab="usage">用量 / 免费额度</button></nav></div></header>
<div id="notice" class="hidden card p-4 mb-4"></div>
<main id="content"></main>
</div><script>
let current='overview',inv=null,charts={};const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(Number(n||0)),bytes=n=>{n=Number(n||0);for(const u of ['B','KB','MB','GB','TB']){if(n<1024)return fmt(n)+' '+u;n/=1024}return fmt(n)+' PB'},metric=(a,b,c='')=>`<div class="metric"><div class="text-slate-500 text-sm">${a}</div><b class="block mt-2">${b}</b><div class="text-xs text-slate-400 mt-2">${c}</div></div>`,card=(t,b)=>`<section class="card p-5"><h2 class="font-black text-lg mb-4">${t}</h2>${b}</section>`;
async function api(path){const r=await fetch('/api/'+path);const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'请求失败');return d}
function clearCharts(){Object.values(charts).forEach(c=>c.dispose());charts={}}
function chart(id,opt){const el=document.getElementById(id);if(!el)return;charts[id]=echarts.init(el);charts[id].setOption(opt)}
function line(id,rows,series){chart(id,{tooltip:{trigger:'axis'},legend:{data:series.map(x=>x.name)},grid:{left:55,right:25,top:45,bottom:45},xAxis:{type:'category',data:rows.map(x=>x.date)},yAxis:{type:'value'},series:series.map(s=>({name:s.name,type:'line',smooth:true,showSymbol:false,data:rows.map(x=>x[s.key]||0),areaStyle:s.area?{}:undefined}))})}
async function loadOverview(){const d=inv||await api('inventory');inv=d;$('#zone').innerHTML='<option value="">选择 Zone</option>'+d.resources.zones.map(z=>`<option value="${z.id}">${z.name} · ${z.status}</option>`).join('');
const c=d.counts;$('#content').innerHTML=`<div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-3 mb-5">${[['Zone',c.zones],['Workers',c.workers],['D1',c.d1],['KV',c.kv],['R2',c.r2],['Durable Objects',c.durableObjects],['Queues',c.queues]].map(x=>metric(x[0],fmt(x[1]),'已发现资源')).join('')}</div>${card('资源详情',`<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-3">${[['Workers',d.resources.workers.map(x=>x.id)],['D1',d.resources.d1.map(x=>x.name)],['KV',d.resources.kv.map(x=>x.title)],['R2',d.resources.r2.map(x=>x.name)],['Durable Objects',d.resources.durableObjects.map(x=>x.name)],['Queues',d.resources.queues.map(x=>x.name)]].map(([n,a])=>`<div class="metric"><b class="text-base">${n}</b><div class="text-sm text-slate-500 mt-3">${a.length?a.join(' · '):'未发现'}</div></div>`).join('')}</div>`)}`;if(d.warnings?.length)notice('部分资源无法读取：'+d.warnings.map(x=>x.name+'（'+x.error+'）').join('；'),'warn')}
function zonePath(kind){const z=$('#zone').value;if(!z)throw Error('请先在右上角选择 Zone');return `${kind}?zone=${encodeURIComponent(z)}&days=${$('#days').value}`}
async function loadZone(){const d=await api(zonePath('zone'));const t=d.totals;const hit=t.bytes?((t.cachedBytes/t.bytes)*100).toFixed(2):'0';$('#content').innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-3 mb-5">${metric('总请求',fmt(t.requests),`${d.range.days} 天`)+metric('总流量',bytes(t.bytes))+metric('缓存流量',bytes(t.cachedBytes),`缓存比例 ${hit}%`)+metric('Threats',fmt(t.threats))+metric('Page Views',fmt(t.pageViews))+metric('Unique Visitors',fmt(t.uniques))}</div><div class="grid xl:grid-cols-2 gap-5">${card('请求 / Page Views 趋势','<div id="z1" class="chart"></div>')+card('流量 / 缓存流量趋势','<div id="z2" class="chart"></div>')+card('Threats / Visitors','<div id="z3" class="chart"></div>')+card('HTTP 状态码分布','<div id="z4" class="chart"></div>')}</div>`;line('z1',d.trend,[{name:'Requests',key:'requests',area:true},{name:'Page Views',key:'pageViews'}]);line('z2',d.trend,[{name:'Bytes',key:'bytes'},{name:'Cached Bytes',key:'cachedBytes'}]);line('z3',d.trend,[{name:'Threats',key:'threats'},{name:'Uniques',key:'uniques'}]);chart('z4',{tooltip:{trigger:'item'},series:[{type:'pie',radius:['38%','70%'],data:Object.entries(d.status).map(([name,value])=>({name,value}))}]})}
async function loadWorkers(){const d=await api(`workers?days=${$('#days').value}`),t=d.totals,rate=t.requests?(t.errors/t.requests*100).toFixed(3):0;$('#content').innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">${metric('Requests',fmt(t.requests))+metric('Errors',fmt(t.errors),`错误率 ${rate}%`)+metric('Subrequests',fmt(t.subrequests))+metric('CPU Time',fmt(t.cpuTime)+' ms')}</div><div class="grid xl:grid-cols-2 gap-5 mb-5">${card('请求 / 错误趋势','<div id="w1" class="chart"></div>')+card('CPU Time 趋势','<div id="w2" class="chart"></div>')}</div>${card('Worker 排行',table(d.scripts,['name','requests','errors','cpuTime','subrequests']))}`;const dates=[...new Set([...d.trend.requests,...d.trend.errors].map(x=>x.date))].sort();const rows=dates.map(date=>({date,requests:d.trend.requests.find(x=>x.date===date)?.value||0,errors:d.trend.errors.find(x=>x.date===date)?.value||0,cpuTime:d.trend.cpuTime.find(x=>x.date===date)?.value||0}));line('w1',rows,[{name:'Requests',key:'requests',area:true},{name:'Errors',key:'errors'}]);line('w2',rows,[{name:'CPU Time ms',key:'cpuTime',area:true}])}
async function loadD1(){const d=await api(`d1?days=${$('#days').value}`),t=d.totals;$('#content').innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">${metric('Rows Read',fmt(t.rowsRead),'Free 参考：5,000,000 / 天')+metric('Rows Written',fmt(t.rowsWritten),'Free 参考：100,000 / 天')+metric('Read Queries',fmt(t.readQueries))+metric('Write Queries',fmt(t.writeQueries))+metric('D1 Storage',bytes(t.databaseSizeBytes))+metric('Response Bytes',bytes(t.queryBatchResponseBytes))+metric('Query Batch Time',fmt(t.queryBatchTimeMs)+' ms')+metric('平均每次查询时间',fmt((t.readQueries+t.writeQueries)?t.queryBatchTimeMs/(t.readQueries+t.writeQueries):0)+' ms')}</div><div class="grid xl:grid-cols-2 gap-5 mb-5">${card('Rows Read / Written','<div id="d1a" class="chart"></div>')+card('Read / Write Queries','<div id="d1b" class="chart"></div>')}</div>${card('数据库排行',table(d.databases,['id','rowsRead','rowsWritten','readQueries','writeQueries','databaseSizeBytes']))}`;const dates=[...new Set([...d.trend.rowsRead,...d.trend.rowsWritten,...d.trend.readQueries,...d.trend.writeQueries].map(x=>x.date))].sort();const rows=dates.map(date=>({date,rowsRead:d.trend.rowsRead.find(x=>x.date===date)?.value||0,rowsWritten:d.trend.rowsWritten.find(x=>x.date===date)?.value||0,readQueries:d.trend.readQueries.find(x=>x.date===date)?.value||0,writeQueries:d.trend.writeQueries.find(x=>x.date===date)?.value||0}));line('d1a',rows,[{name:'Rows Read',key:'rowsRead',area:true},{name:'Rows Written',key:'rowsWritten'}]);line('d1b',rows,[{name:'Read Queries',key:'readQueries',area:true},{name:'Write Queries',key:'writeQueries'}])}
async function loadKV(){const d=await api(`kv?days=${$('#days').value}`);$('#content').innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-5">${metric('KV 总操作',fmt(d.totalRequests))+metric('KV Storage',bytes(d.storageBytes))+metric('活跃 Namespace',fmt(d.namespaces.length))}</div><div class="grid xl:grid-cols-2 gap-5 mb-5">${card('KV 操作趋势','<div id="k1" class="chart"></div>')+card('操作类型分布','<div id="k2" class="chart"></div>')}</div>${card('Namespace 排行',table(d.namespaces,['id','requests','storageBytes']))}`;line('k1',d.trend.map(x=>({date:x.date,requests:x.value})),[{name:'Requests',key:'requests',area:true}]);chart('k2',{tooltip:{trigger:'item'},series:[{type:'pie',radius:['40%','70%'],data:Object.entries(d.actions).map(([name,value])=>({name,value}))}]})}
function placeholder(title,desc,items=[]){$('#content').innerHTML=card(title,`<p class="text-slate-500 mb-5">${desc}</p>${items.length?'<div class="grid md:grid-cols-3 gap-3">'+items.map(x=>metric(x[0],x[1],x[2]||'')).join('')+'</div>':''}<div class="mt-5 p-4 rounded-xl bg-slate-50 text-slate-500">这一页暂不自动请求 Analytics，因此不会产生额外查询。后续可在确认你的 Cloudflare 账户实际开放的数据集后继续扩展 R2 / Durable Objects 的精确指标。</div>`)}
async function loadSecurity(){const d=await api(zonePath('security'));$('#content').innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-5">${metric('安全事件',fmt(d.total),`${d.range.days} 天`)+metric('Action 类型',fmt(Object.keys(d.actions).length))+metric('来源国家',fmt(Object.keys(d.countries).length))}</div><div class="grid xl:grid-cols-2 gap-5">${card('Action 分布','<div id="s1" class="chart"></div>')+card('Top 来源国家','<div id="s2" class="chart"></div>')}</div>`;chart('s1',{tooltip:{trigger:'item'},series:[{type:'pie',radius:['40%','70%'],data:Object.entries(d.actions).map(([name,value])=>({name,value}))}]});chart('s2',{tooltip:{trigger:'axis'},xAxis:{type:'value'},yAxis:{type:'category',data:Object.entries(d.countries).sort((a,b)=>b[1]-a[1]).slice(0,15).map(x=>x[0])},series:[{type:'bar',data:Object.entries(d.countries).sort((a,b)=>b[1]-a[1]).slice(0,15).map(x=>x[1])}]})}
async function loadUsage(){try{const d=await api('usage');const rows=Array.isArray(d.result)?d.result:(d.result?.result||d.result?.items||[]);$('#content').innerHTML=card('Cloudflare Billable Usage',rows.length?table(rows.slice(-100).reverse(),Object.keys(rows[0]||{}).slice(0,8)):'当前 API 返回为空');}catch(e){$('#content').innerHTML=card('用量 / 免费额度',`<div class="p-4 rounded-xl bg-amber-50 text-amber-700">${e.message}</div><p class="text-slate-500 mt-4">Cloudflare Billable Usage 并非所有账户/API 都开放。D1、Workers 等页面仍可提供 Analytics 指标，但 Analytics 不应被误认为最终计费数据。</p>`)}}
function table(rows,cols){if(!rows.length)return '<div class="text-slate-400">暂无数据</div>';return `<div class="overflow-auto"><table class="min-w-full text-sm"><thead><tr class="border-b">${cols.map(c=>`<th class="text-left p-2">${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="border-b hover:bg-slate-50">${cols.map(c=>`<td class="p-2">${c.toLowerCase().includes('byte')?bytes(r[c]):typeof r[c]==='number'?fmt(r[c]):String(r[c]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function notice(msg,type='err'){$('#notice').textContent=msg;$('#notice').className='card p-4 mb-4 '+(type==='warn'?'text-amber-700 bg-amber-50':'text-red-700 bg-red-50')}
async function load(){clearCharts();$('#notice').classList.add('hidden');try{if(current==='overview')await loadOverview();else if(current==='zone')await loadZone();else if(current==='workers')await loadWorkers();else if(current==='d1')await loadD1();else if(current==='kv')await loadKV();else if(current==='security')await loadSecurity();else if(current==='usage')await loadUsage();else if(current==='r2')placeholder('R2','R2 Bucket 已在总览自动发现，但本版本不猜测不存在的 GraphQL 字段。');else if(current==='do')placeholder('Durable Objects','Durable Objects Namespace 已在总览自动发现，指标将按 Cloudflare 当前账户 Schema 独立扩展。');}catch(e){$('#content').innerHTML=card('加载失败',`<div class="p-4 rounded-xl bg-red-50 text-red-700">${e.message}</div><p class="text-slate-500 mt-4">这是独立页签错误，不会影响其他监控项目。建议把错误信息发给我，我可以针对你的账户实际 GraphQL Schema 修正对应查询。</p>`)}}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;current=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()};$('#refresh').onclick=load;$('#days').onchange=()=>{if(current!=='overview')load()};$('#zone').onchange=()=>{if(['zone','security'].includes(current))load()};
api('config').then(d=>{$('#title').textContent=d.siteName;document.title=d.siteName}).catch(()=>{}).finally(load);
window.addEventListener('resize',()=>Object.values(charts).forEach(x=>x.resize()));
</script></body></html>
