<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloudflare Status</title><link rel="icon" href="/favicon.svg"><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script><style>:root{--bg:#f6f8fb;--card:rgba(255,255,255,.88);--border:#e2e8f0;--text:#0f172a;--muted:#64748b}*{box-sizing:border-box}body{margin:0;color:var(--text);background:radial-gradient(circle at 8% 0%,#dbeafe,transparent 28%),radial-gradient(circle at 90% 8%,#ede9fe,transparent 30%),var(--bg);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.shell{max-width:1440px;margin:auto;padding:18px}.glass,.card{background:var(--card);border:1px solid var(--border);backdrop-filter:blur(18px);box-shadow:0 20px 55px -45px #0f172a;border-radius:20px}.glass{padding:18px}.nav{position:sticky;top:10px;z-index:20;display:flex;gap:6px;padding:7px;overflow:auto}.tab,.btn{border:1px solid var(--border);background:transparent;color:var(--muted);padding:10px 15px;border-radius:12px;font-weight:700;cursor:pointer;white-space:nowrap}.tab.active{background:#0f172a;color:#fff}.card{padding:18px}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g8{grid-template-columns:repeat(8,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:15px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(180deg,#fff,#f8fafc)}.label{font-size:12px;color:var(--muted)}.value{font-size:27px;font-weight:900;margin-top:5px}.chart{height:330px}.section{font-size:18px;font-weight:900;border-left:5px solid #2563eb;padding-left:12px;margin:0 0 6px}.muted{color:var(--muted)}.loading{text-align:center;padding:45px;color:var(--muted)}.error{color:#b91c1c;background:#fef2f2;border-color:#fecaca}.select{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--card);color:var(--text)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}@media(max-width:900px){.g8,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}@media(max-width:560px){.g8,.g4{grid-template-columns:1fr 1fr}.shell{padding:10px}.value{font-size:22px}}[data-theme=dark]{--bg:#09111f;--card:rgba(15,23,42,.9);--border:#263449;--text:#e5e7eb;--muted:#94a3b8}[data-theme=dark] .metric{background:#111827}</style></head><body><main class="shell"><header class="glass"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center"><div><div style="font-size:12px;color:#2563eb;font-weight:900">CLOUDFLARE ACCOUNT ANALYTICS</div><h1 id="title" style="font-size:30px;margin:10px 0 4px">Cloudflare Status</h1><div class="muted">按产品懒加载 · 首屏不请求全部 Analytics</div></div><div style="display:flex;gap:8px"><button id="refresh" class="btn">刷新</button><button id="theme" class="btn">☾</button></div></div></header><nav id="tabs" class="glass nav" style="margin-top:10px"></nav><div id="err" class="card error" style="display:none;margin-top:10px"></div><div id="app" style="margin-top:15px"></div><footer class="muted" style="text-align:center;font-size:12px;padding:30px">Cloudflare Status V2</footer></main><script>
const $=s=>document.querySelector(s),T=[['overview','总览'],['zone','网站 / Zone'],['workers','Workers'],['d1','D1'],['kv','KV'],['r2','R2'],['do','Durable Objects'],['workflow','Workflows'],['security','安全']],S={tab:localStorage.cfTab||'overview',days:7,inv:null,account:null};let charts=[];document.documentElement.dataset.theme=localStorage.cfTheme||'light';$('#tabs').innerHTML=T.map(x=>`<button class="tab ${x[0]===S.tab?'active':''}" data-tab="${x[0]}">${x[1]}</button>`).join('');document.addEventListener('click',e=>{let x=e.target.closest('[data-tab]');if(x){S.tab=x.dataset.tab;localStorage.cfTab=S.tab;render()}});$('#theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.cfTheme=document.documentElement.dataset.theme;charts.forEach(c=>c.resize())};$('#refresh').onclick=()=>{if(S.tab==='overview')S.inv=null;else S.account=null;render()};const fmt=n=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(Number(n||0)),bytes=n=>{n=Number(n||0);for(let u of ['B','KB','MB','GB','TB']){if(n<1024)return fmt(n)+' '+u;n/=1024}return fmt(n)+' PB'};async function api(p){let r=await fetch(p),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'请求失败');return d}function m(a,b,c=''){return`<div class="metric"><div class="label">${a}</div><div class="value">${b}</div><div class="label" style="margin-top:6px">${c}</div></div>`}function box(title,body){return`<section><h2 class="section">${title}</h2>${body}</section>`}function chart(id,o){requestAnimationFrame(()=>{let c=echarts.init(document.getElementById(id));charts.push(c);c.setOption(o)})}function line(rows,name){return{tooltip:{trigger:'axis'},xAxis:{type:'category',data:rows.map(x=>String(x.date).slice(0,16))},yAxis:{type:'value'},series:[{name,type:'line',smooth:true,data:rows.map(x=>x.value),areaStyle:{}}]}}function bar(rows){return{tooltip:{trigger:'axis'},xAxis:{type:'category',data:rows.map(x=>x.name)},yAxis:{type:'value'},series:[{type:'bar',data:rows.map(x=>x.value)}]}}function pie(rows){return{tooltip:{trigger:'item'},series:[{type:'pie',radius:['40%','70%'],data:rows}]}}
async function inventory(){if(!S.inv)S.inv=await api('/api/inventory');return S.inv}async function render(){charts=[];document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===S.tab));$('#err').style.display='none';$('#app').innerHTML='<div class="card loading">加载中…</div>';try{if(S.tab==='overview')await overview();else if(S.tab==='zone')await zone();else if(S.tab==='security')await security();else await product(S.tab)}catch(e){$('#err').textContent=e.message;$('#err').style.display='block';$('#app').innerHTML='<div class="card loading">模块加载失败</div>'}}
async function overview(){let d=await inventory();let items=[['Zone',d.counts.zones],['Workers',d.counts.workers],['D1',d.counts.d1],['KV',d.counts.kv],['R2',d.counts.r2],['DO',d.counts.durableObjects],['Queues',d.counts.queues],['Workflows',d.counts.workflows]];$('#app').innerHTML=box('资源总览',`<div class="grid g8">${items.map(x=>m(x[0],fmt(x[1]),'已发现资源')).join('')}</div><div class="card" style="margin-top:15px"><h2 class="section">资源清单</h2><div class="grid g4">${Object.entries(d.resources).map(([k,a])=>`<div class="metric"><b>${k}</b><div class="muted" style="font-size:13px;margin-top:7px;word-break:break-all">${a.length?a.map(x=>x.name||x.id).join(' · '):'无'}</div></div>`).join('')}</div></div>`)}
async function product(tab){let d=S.account;if(!d)d=S.account=await api(`/api/account?days=${S.days}`);let a={workers:d.workers,d1:d.d1,kv:d.kv,r2:d.r2,do:d.do,workflow:d.workflow}[tab],title={workers:'Workers',d1:'D1',kv:'Workers KV',r2:'R2',do:'Durable Objects',workflow:'Workflows'}[tab],cards='',html='';if(tab==='workers'){cards=m('Requests',fmt(a.total),`Errors ${fmt(a.errors)} · Error Rate ${a.total?(a.errors/a.total*100).toFixed(3):0}%`)+m('Subrequests',fmt(a.subrequests))+m('CPU Time',fmt(a.cpu)+' ms')+m('Wall Time',fmt(a.wall)+' ms');html='<div class="card"><b>Requests 趋势</b><div id="c1" class="chart"></div></div><div class="card"><b>Errors 趋势</b><div id="c2" class="chart"></div></div><div class="card"><b>Worker 排行</b><div id="c3" class="chart"></div></div>'}if(tab==='d1'){cards=m('Rows Read',fmt(a.rowsRead),'计费相关指标')+m('Rows Written',fmt(a.rowsWritten),'计费相关指标')+m('Read Queries',fmt(a.read))+m('Write Queries',fmt(a.write))+m('Storage',bytes(a.storage))+m('Response',bytes(a.response))+m('Latency',fmt(a.latency)+' ms');html='<div class="card"><b>Rows Read / Written</b><div id="c1" class="chart"></div></div><div class="card"><b>数据库 Rows Read 排行</b><div id="c2" class="chart"></div></div>'}if(tab==='kv'){cards=m('Operations',fmt(a.requests))+m('Storage',bytes(a.storage))+m('Namespaces',fmt(a.namespaces.length));html='<div class="card"><b>操作趋势</b><div id="c1" class="chart"></div></div><div class="card"><b>操作类型</b><div id="c2" class="chart"></div></div><div class="card"><b>Namespace 排行</b><div id="c3" class="chart"></div></div>'}if(tab==='r2'){cards=m('Operations',fmt(a.operations))+m('Storage',bytes(a.storage))+m('Objects',fmt(a.objects));html='<div class="card"><b>操作趋势</b><div id="c1" class="chart"></div></div><div class="card"><b>操作类型</b><div id="c2" class="chart"></div></div><div class="card"><b>Bucket 排行</b><div id="c3" class="chart"></div></div>'}if(tab==='do'){cards=m('Requests',fmt(a.requests))+m('Errors',fmt(a.errors))+m('CPU',fmt(a.cpu)+' ms')+m('Storage',bytes(a.storage));html='<div class="card"><b>请求趋势</b><div id="c1" class="chart"></div></div><div class="card"><b>Namespace 排行</b><div id="c2" class="chart"></div></div>'}if(tab==='workflow'){cards=m('Runs',fmt(a.runs))+m('Steps',fmt(a.steps))+m('Wall Time',fmt(a.wall)+' ms');html='<div class="card"><b>Runs 趋势</b><div id="c1" class="chart"></div></div><div class="card"><b>Workflow 排行</b><div id="c2" class="chart"></div></div>'}$('#app').innerHTML=box(title,`<div class="grid g4">${cards}</div><div class="grid g2" style="margin-top:15px">${html}</div>`);if(tab==='workers'){chart('c1',line(a.trend,'Requests'));chart('c2',line(a.errorsTrend,'Errors'));chart('c3',bar(a.scripts))}if(tab==='d1'){chart('c1',{tooltip:{trigger:'axis'},xAxis:{type:'category',data:a.readTrend.map(x=>x.date)},yAxis:{type:'value'},series:[{name:'Rows Read',type:'line',data:a.readTrend.map(x=>x.value),smooth:true},{name:'Rows Written',type:'line',data:a.writeTrend.map(x=>x.value),smooth:true}]});chart('c2',bar(a.databases))}if(tab==='kv'){chart('c1',line(a.trend,'Operations'));chart('c2',pie(a.actions));chart('c3',bar(a.namespaces))}if(tab==='r2'){chart('c1',line(a.trend,'Operations'));chart('c2',pie(a.actions));chart('c3',bar(a.buckets))}if(tab==='do'){chart('c1',line(a.trend,'Requests'));chart('c2',bar(a.namespaces))}if(tab==='workflow'){chart('c1',line(a.trend,'Runs'));chart('c2',bar(a.names))}}
async function zone(){let d=await inventory();$('#app').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 class="section">网站 / Zone</h2><div class="muted">选择 Zone 后才请求 HTTP Analytics。</div></div><select id="zs" class="select">${d.resources.zones.map(z=>`<option value="${z.id}">${z.name}</option>`).join('')}</select></div></div><div id="zb" style="margin-top:15px"></div>`;$('#zs').onchange=loadZone;await loadZone()}async function loadZone(){let z=$('#zs').value,d=await api(`/api/zone?days=${S.days}&zone=${encodeURIComponent(z)}`);$('#zb').innerHTML=`<div class="grid g4">${m('Requests',fmt(d.total))+m('Visits',fmt(d.visits))+m('Edge Response',bytes(d.bytes))+m('Firewall Events',fmt(d.firewall.count))}</div><div class="grid g2" style="margin-top:15px"><div class="card"><b>请求趋势</b><div id="z1" class="chart"></div></div><div class="card"><b>国家</b><div id="z2" class="chart"></div></div><div class="card"><b>状态码</b><div id="z3" class="chart"></div></div><div class="card"><b>浏览器</b><div id="z4" class="chart"></div></div><div class="card"><b>设备</b><div id="z5" class="chart"></div></div><div class="card"><b>Colo</b><div id="z6" class="chart"></div></div><div class="card"><b>Firewall Action</b><div id="z7" class="chart"></div></div></div>`;chart('z1',line(d.trend,'Requests'));[['z2',d.countries],['z3',d.statuses],['z4',d.browsers],['z5',d.devices],['z6',d.colos],['z7',d.firewall.actions]].forEach(x=>chart(x[0],bar(x[1])))}async function security(){await zone()}api('/api/config').then(x=>$('#title').textContent=x.siteName).finally(render);window.onresize=()=>charts.forEach(c=>c.resize());</script></body></html>
