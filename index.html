<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloudflare Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
@import url('https://fastly.jsdelivr.net/npm/cn-fontsource-ding-talk-jin-bu-ti-regular/font.css');
:root{
 --bg:#f5f8ff;--surface:rgba(255,255,255,.76);--surface-solid:#fff;--surface2:rgba(248,250,252,.78);
 --text:#0f172a;--muted:#64748b;--line:rgba(203,213,225,.68);
 --blue:#0ea5e9;--indigo:#6366f1;--violet:#8b5cf6;--cyan:#06b6d4;--green:#10b981;--orange:#f59e0b;--red:#ef4444;--pink:#ec4899;
 --shadow:0 22px 70px -48px rgba(15,23,42,.36);--radius:20px;--mx:50vw;--my:20vh
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"DingTalk JinBuTi",Roboto,"PingFang SC","Microsoft YaHei",sans-serif!important;color:var(--text)}
body{overflow-x:hidden;background:
 radial-gradient(900px 520px at 8% -5%,rgba(56,189,248,.20),transparent 62%),
 radial-gradient(780px 520px at 94% 3%,rgba(129,140,248,.18),transparent 60%),
 linear-gradient(180deg,#f8fbff 0%,#f5f7fb 46%,#edf3ff 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(480px circle at var(--mx) var(--my),rgba(56,189,248,.11),transparent 58%);transition:background-position .08s linear}
button,select{font:inherit}button{cursor:pointer}
.shell{position:relative;z-index:1;max-width:1540px;margin:24px auto;padding:0 22px 26px}
.app-shell{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.72);border-radius:30px;padding:18px;background:rgba(255,255,255,.36);box-shadow:0 35px 100px -58px rgba(15,23,42,.34);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.app-shell::after{content:"";position:absolute;width:380px;height:380px;right:-180px;top:-180px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.13),transparent 68%);pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 2px 14px}
.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:900;letter-spacing:-.04em;background:linear-gradient(135deg,#0ea5e9,#6366f1 58%,#8b5cf6);box-shadow:0 14px 34px -16px rgba(79,70,229,.6);position:relative;overflow:hidden}.brand-mark::after{content:"";position:absolute;inset:-45%;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.48),transparent 65%);transform:translateX(-70%);animation:shine 4.5s ease-in-out infinite}.brand h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.03em}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.68);color:#334155;border-radius:12px;padding:9px 13px;font-weight:700;box-shadow:0 10px 28px -24px rgba(15,23,42,.45);transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease}.btn:hover{transform:translateY(-1px);border-color:rgba(56,189,248,.5);background:#fff;box-shadow:0 18px 35px -25px rgba(2,132,199,.42)}.btn.primary{background:#0f172a;color:#fff;border-color:#0f172a}.btn.primary:hover{background:#111827}
.nav{display:flex;align-items:center;gap:4px;overflow:auto;padding:5px;margin-bottom:8px;border:1px solid rgba(226,232,240,.8);background:rgba(255,255,255,.66);border-radius:16px;box-shadow:0 16px 45px -38px rgba(15,23,42,.42);scrollbar-width:none;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.nav::-webkit-scrollbar{display:none}.tab{position:relative;display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:#64748b;padding:9px 13px;border-radius:11px;white-space:nowrap;font-size:13px;font-weight:700;transition:color .2s ease,background .2s ease,transform .2s ease}.tab:hover{background:rgba(255,255,255,.78);color:#0f172a;transform:translateY(-1px)}.tab.active{color:#fff;background:linear-gradient(135deg,#0f172a,#334155);box-shadow:0 12px 26px -19px rgba(15,23,42,.8)}.tab-dot{width:6px;height:6px;flex:none;border-radius:999px;background:#cbd5e1;transition:transform .2s ease,background .2s ease,box-shadow .2s ease}.tab.active .tab-dot{background:#38bdf8;transform:scale(1.18);box-shadow:0 0 0 3px rgba(56,189,248,.10)}.tab-separator{width:1px;height:20px;flex:none;background:rgba(203,213,225,.75);margin:0 3px}.tab-refresh{margin-left:1px}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px solid rgba(226,232,240,.78);background:rgba(255,255,255,.64);border-radius:16px;margin-bottom:15px;box-shadow:0 16px 44px -40px rgba(15,23,42,.42);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.ranges{display:flex;gap:4px}.range{border:0;background:transparent;color:#64748b;border-radius:10px;padding:7px 11px;font-weight:700;font-size:12px;transition:all .18s ease}.range:hover{background:rgba(255,255,255,.85);color:#0f172a}.range.active{background:#e0f2fe;color:#0369a1;box-shadow:inset 0 0 0 1px rgba(14,165,233,.18)}select{min-width:270px;border:1px solid var(--line);background:rgba(255,255,255,.84);border-radius:10px;padding:8px 10px;color:#334155;outline:none}.state{font-size:12px;color:#94a3b8}
.hero{position:relative;overflow:hidden;background:rgba(255,255,255,.72);border:1px solid rgba(226,232,240,.82);border-radius:22px;padding:21px;margin-bottom:14px;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.06) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(90deg,#000,transparent 82%);pointer-events:none}.hero-title{position:relative;font-size:12px;color:#94a3b8;font-weight:800;letter-spacing:.13em}.hero-main{position:relative;display:flex;align-items:end;justify-content:space-between;gap:20px;margin-top:7px}.hero h2{font-size:28px;margin:0;letter-spacing:-.04em}.hero-note{font-size:12px;color:#94a3b8}.hero-desc{margin-top:5px;font-size:12px;color:#64748b}.small-empty{height:230px;padding:20px;text-align:center}
.grid{display:grid;gap:12px}.metrics{grid-template-columns:repeat(6,minmax(0,1fr))}.metric-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.metric-icon{width:42px;height:42px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--mc);background:var(--mb);transition:transform .25s ease,box-shadow .25s ease}.metric-icon svg{width:21px;height:21px}.metric:hover .metric-icon{transform:translateY(-2px) rotate(-3deg);box-shadow:0 8px 20px var(--mb)}
.metric{position:relative;overflow:hidden;background:rgba(255,255,255,.72);border:1px solid rgba(226,232,240,.82);border-radius:17px;padding:15px;box-shadow:0 18px 50px -42px rgba(15,23,42,.38);min-width:0;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}.metric::after,.card::after{content:"";position:absolute;inset:auto -20% -70% 20%;height:130px;background:radial-gradient(circle,rgba(56,189,248,.10),transparent 68%);opacity:0;transition:opacity .25s ease;pointer-events:none}.metric:hover,.card:hover{transform:translateY(-3px);border-color:rgba(56,189,248,.38);box-shadow:0 30px 72px -48px rgba(15,23,42,.48)}.metric:hover::after,.card:hover::after{opacity:1}.metric-label{font-size:12px;color:#64748b}.metric-value{font-size:22px;font-weight:800;margin-top:7px;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric-sub{font-size:11px;color:#94a3b8;margin-top:4px}
.overview-status{margin-top:12px}.overview-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.overview-summary>div{padding:13px 14px;border-radius:13px;background:rgba(248,250,252,.68);border:1px solid rgba(226,232,240,.68)}.overview-summary strong{display:block;font-size:20px;letter-spacing:-.03em}.overview-summary span{display:block;margin-top:3px;color:#94a3b8;font-size:11px}.resource-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.resource-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:13px;background:rgba(248,250,252,.54);border:1px solid rgba(226,232,240,.62)}.resource-name{font-size:12px;font-weight:800}.resource-desc{font-size:10px;color:#94a3b8;margin-top:3px}.resource-right{display:flex;align-items:center;gap:10px;flex:none}.resource-right strong{font-size:15px}.status-dot{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:#64748b}.status-dot i{display:block;width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.10)}.charts{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}.card{position:relative;overflow:hidden;background:rgba(255,255,255,.72);border:1px solid rgba(226,232,240,.82);border-radius:18px;padding:15px;box-shadow:0 22px 60px -47px rgba(15,23,42,.4);min-width:0;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}.card.wide{grid-column:1/-1}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.card-title{font-size:14px;font-weight:800;margin:0}.card-note{font-size:11px;color:#94a3b8;margin-top:3px}.chart{height:300px;margin-top:7px}.pie{height:300px}.list{margin-top:10px;display:flex;flex-direction:column;gap:7px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 10px;border-radius:11px;background:rgba(248,250,252,.72);font-size:12px}.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row strong{font-weight:800}.notice{padding:11px 13px;border-radius:12px;background:rgba(240,249,255,.88);border:1px solid rgba(125,211,252,.55);color:#075985;font-size:12px;margin-bottom:12px}.error{padding:18px;border-radius:15px;background:rgba(254,242,242,.9);border:1px solid #fecaca;color:#b91c1c;font-size:13px}.empty{height:280px;display:grid;place-items:center;color:#94a3b8;font-size:13px}.loading{height:110px;border-radius:15px;background:rgba(255,255,255,.56);border:1px solid rgba(226,232,240,.72);display:grid;place-items:center;color:#94a3b8;font-size:12px}.loading.chart-load{height:220px}.page-loading{display:none}.load-dot{position:relative;width:7px;height:7px;flex:none;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.35);animation:dotPulse 1.35s ease-out infinite}.load-dot::after{content:"";position:absolute;inset:-6px;border:1px solid rgba(22,163,74,.28);border-radius:50%;animation:dotRing 1.35s ease-out infinite}@keyframes dotPulse{0%,100%{transform:scale(.9);box-shadow:0 0 0 0 rgba(22,163,74,.30)}45%{transform:scale(1.15);box-shadow:0 0 0 6px rgba(22,163,74,.02)}70%{transform:scale(1);box-shadow:0 0 0 0 rgba(22,163,74,0)}}@keyframes dotRing{0%{transform:scale(.55);opacity:.8}70%,100%{transform:scale(1.5);opacity:0}}.skeleton{position:relative;overflow:hidden;background:rgba(226,232,240,.58);border-color:rgba(226,232,240,.72)!important;box-shadow:none!important}.skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.78) 45%,rgba(255,255,255,.24) 55%,transparent 78%);transform:translateX(-110%);animation:shimmer 1.55s ease-in-out infinite}.skeleton-line{height:10px;border-radius:999px;background:rgba(203,213,225,.58)}.skeleton-line.w1{width:42%}.skeleton-line.w2{width:68%}.skeleton-line.w3{width:84%}.skeleton-value{width:46%;height:24px;margin-top:9px;border-radius:8px;background:rgba(203,213,225,.62)}.skeleton-chart{height:230px;margin-top:12px;border-radius:14px;background:linear-gradient(180deg,rgba(226,232,240,.45),rgba(241,245,249,.7))}.skeleton-chart::before{content:"";position:absolute;left:8%;right:8%;bottom:18%;height:1px;background:rgba(148,163,184,.18);box-shadow:0 -55px 0 rgba(148,163,184,.10),0 -110px 0 rgba(148,163,184,.08)}@keyframes shimmer{100%{transform:translateX(110%)}}.loading-state{display:inline-flex;align-items:center;gap:8px;color:#94a3b8;font-size:12px;white-space:nowrap}.loading-state .load-dot{background:#0ea5e9}.loading-state .load-dot::after{border-color:rgba(14,165,233,.28)}
.footer{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;color:#94a3b8;font-size:11px;padding:18px 0 2px}.footer-info{display:flex;align-items:center;gap:8px}.footer-refresh{padding:7px 11px;border-radius:10px}.footer-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.10)}.footer-dot.is-loading{animation:dotPulse 1.35s ease-out infinite}.theme{position:fixed;right:18px;bottom:18px;border:1px solid var(--line);background:rgba(255,255,255,.78);color:var(--text);border-radius:999px;padding:9px 12px;box-shadow:0 22px 54px -32px rgba(15,23,42,.42);backdrop-filter:blur(16px);z-index:20}
html.dark{--bg:#090f18;--surface:rgba(15,23,42,.72);--surface-solid:#0f172a;--surface2:rgba(30,41,59,.72);--text:#eef2ff;--muted:#94a3b8;--line:rgba(71,85,105,.58)}html.dark body{background:radial-gradient(900px 520px at 8% -5%,rgba(14,165,233,.13),transparent 62%),radial-gradient(780px 520px at 94% 3%,rgba(99,102,241,.14),transparent 60%),#090f18}html.dark .app-shell,html.dark .nav,html.dark .controls,html.dark .hero,html.dark .metric,html.dark .card{background:rgba(15,23,42,.68);border-color:rgba(71,85,105,.52)}html.dark .btn,html.dark select{background:rgba(15,23,42,.72);color:#e2e8f0;border-color:rgba(71,85,105,.58)}html.dark .btn.primary,.html.dark .tab.active{background:#f8fafc;color:#0f172a}html.dark .tab:hover,html.dark .range:hover{background:rgba(30,41,59,.8);color:#f8fafc}html.dark .range.active{background:rgba(14,165,233,.18);color:#7dd3fc}html.dark .row,html.dark .overview-summary>div,html.dark .resource-row{background:rgba(30,41,59,.6)}html.dark .resource-desc,html.dark .status-dot{color:#94a3b8}html.dark .notice{background:rgba(8,47,73,.45);border-color:rgba(14,165,233,.35);color:#bae6fd}html.dark .error{background:rgba(69,10,10,.4);border-color:rgba(248,113,113,.35);color:#fca5a5}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.shell{padding:10px}.app-shell{padding:10px;border-radius:22px}.top{align-items:flex-start}.brand h1{font-size:18px}.actions .btn:first-child{display:none}.metrics,.charts,.resource-list{grid-template-columns:1fr}.overview-summary{grid-template-columns:1fr 1fr}.card.wide{grid-column:auto}.hero-main{display:block}.hero-note{margin-top:8px}select{width:100%;min-width:0}.controls{align-items:stretch}.theme{right:10px;bottom:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="shell"><div class="app-shell">
  <header class="top">
    <div class="brand">
      <div class="brand-mark">CF</div>
      <div>
        <h1>Cloudflare Monitor</h1>
        <p id="subtitle">Account 资源与运行状态</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="theme">☾</button>
    </div>
  </header>

  <nav class="nav" id="tabs"></nav>
  <div class="loading-state" id="state"><span class="load-dot"></span><span>准备就绪</span></div>

  <section class="controls">
    <div class="ranges" id="ranges">
      <button class="range active" data-days="1">24 小时</button>
      <button class="range" data-days="7">7 天</button>
      <button class="range" data-days="14">14 天</button>
      <button class="range" data-days="30">30 天</button>
    </div>
    <select id="zone" hidden></select>
    
  </section>

  <main id="content"></main>
  <footer class="footer"><div class="footer-info"><span class="footer-dot"></span><span id="footer-state">Cloudflare Monitor · GraphQL Analytics</span></div><span>·</span><div class="footer-record"><span>备案信息</span><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">ICP备案查询</a></div></footer>
</div></div>

<script>
const T={
 overview:{label:"概览",icon:"✨",desc:"账户资源与整体状态"},
 zone:{label:"网站",icon:"🌐",desc:"访问流量、缓存与安全"},
 workers:{label:"Workers",icon:"⚡",desc:"请求、错误、CPU 与内存"},
 d1:{label:"D1 数据库",icon:"🗄️",desc:"查询、读写行数与延迟"},
 kv:{label:"KV 存储",icon:"🧩",desc:"读写操作、Key 与容量"},
 r2:{label:"R2 对象存储",icon:"📦",desc:"对象、请求与存储量"},
 do:{label:"Durable Objects",icon:"🔷",desc:"请求、CPU、内存与持久化"},
};
const label=k=>T[k]?.label||k;
const S={
 tab:localStorage.getItem("cf-tab")||"overview",
 days:Number(localStorage.getItem("cf-days-v7")||1),
 cache:{},charts:[]
};
const $=s=>document.querySelector(s);
let mouseFrame=0,mouseX=innerWidth*.5,mouseY=innerHeight*.2;
addEventListener("pointermove",e=>{mouseX=e.clientX;mouseY=e.clientY;if(!mouseFrame)mouseFrame=requestAnimationFrame(()=>{document.documentElement.style.setProperty("--mx",mouseX+"px");document.documentElement.style.setProperty("--my",mouseY+"px");mouseFrame=0})},{passive:true});
const fmt=n=>new Intl.NumberFormat("zh-CN",{maximumFractionDigits:2}).format(Number(n||0));
const bytes=n=>{
 n=Number(n||0);const u=["B","KB","MB","GB","TB","PB"];let i=0;
 while(n>=1024&&i<u.length-1){n/=1024;i++}return fmt(n)+" "+u[i]
};
const ms=n=>Number(n||0).toFixed(1)+" ms";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(path){
 const r=await fetch(path,{cache:"no-store"});
 const d=await r.json().catch(()=>({}));
 if(!r.ok||!d.success)throw Error(d.error||"请求失败");
 return d.data;
}
function setState(s){
 const st=$("#state");if(st)st.innerHTML=`<span class="load-dot"></span><span>${esc(s)}</span>`;
 const d=document.querySelector(".footer-dot");if(d)d.classList.toggle("is-loading",String(s).startsWith("加载中"));
}
function dispose(){
 S.charts.forEach(x=>{try{x.dispose()}catch{}});
 S.charts=[];
}
function load(){
 const cards=Array.from({length:6},()=>`<div class="metric skeleton"><div class="skeleton-line w1"></div><div class="skeleton-value"></div><div class="skeleton-line w2" style="margin-top:9px"></div></div>`).join("");
 const charts=`<div class="grid charts"><section class="card skeleton"><div class="skeleton-line w1"></div><div class="skeleton-line w2" style="margin-top:8px"></div><div class="skeleton-chart"></div></section><section class="card skeleton"><div class="skeleton-line w1"></div><div class="skeleton-line w2" style="margin-top:8px"></div><div class="skeleton-chart"></div></section></div>`;
 $("#content").innerHTML=`<section class="hero skeleton"><div class="skeleton-line w1"></div><div class="skeleton-value" style="width:180px"></div><div class="skeleton-line w2" style="margin-top:9px"></div></section><div class="grid metrics">${cards}</div>${S.tab==="overview"?`<section class="card skeleton" style="margin-top:12px"><div class="skeleton-line w1"></div><div class="skeleton-line w3" style="margin-top:9px"></div><div class="skeleton-line w2" style="margin-top:9px"></div></section>`:charts}`;
}
const metricIcons=["M9 12h6m-3-3v6","M3 12h18M12 3v18","M5 12h14l-2-2m2 2-2 2","M4 19h16M6 16h12M8 13h8M10 10h4","M12 3v18M3 12h18","M4 7h16v10H4z M8 11h8"];
const metricColors=["#f97316","#2563eb","#12b76a","#7f56d9","#eab308","#ec4899"];
function metrics(items){
 return `<div class="grid metrics">${items.map((x,i)=>{const c=metricColors[i%metricColors.length],path=metricIcons[i%metricIcons.length];return `<div class="metric">
  <div class="metric-top"><div><div class="metric-label">${x[0]}</div><div class="metric-value">${x[1]}</div></div><div class="metric-icon" style="--mc:${c};--mb:${c}22"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"/></svg></div></div><div class="metric-sub">${x[2]||""}</div>
 </div>`}).join("")}</div>`;
}
function card(title,id,note="",wide=false){
 return `<section class="card ${wide?"wide":""}">
 <div class="card-head"><div><div class="card-title">${title}</div>${note?`<div class="card-note">${note}</div>`:""}</div></div>
 <div class="chart" id="${id}"></div></section>`;
}
function pieCard(title,id){return card(title,id,"Top N")}
function chart(id,opt){
 requestAnimationFrame(()=>{
  const el=document.getElementById(id);if(!el||!opt)return;
  const c=echarts.init(el);S.charts.push(c);c.setOption(opt,{notMerge:true});
  const ro=new ResizeObserver(()=>c.resize());ro.observe(el);c.__ro=ro;
 });
}
function lineOpt(rows,name="请求"){
 rows=rows||[];if(!rows.length)return null;
 return{
  tooltip:{trigger:"axis"},grid:{left:48,right:18,top:25,bottom:40},
  xAxis:{type:"category",data:rows.map(x=>String(x.date).replace("T"," ").slice(0,16)),axisLabel:{fontSize:10}},
  yAxis:{type:"value",axisLabel:{fontSize:10}},
  series:[{name,type:"line",smooth:true,symbol:"none",data:rows.map(x=>x.value||0),lineStyle:{width:2.5,color:"#f48120"},areaStyle:{opacity:.12,color:"#f48120"}}]
 };
}
function multiLine(a){
 const rows=a.filter(x=>x.rows?.length);if(!rows.length)return null;
 const dates=[...new Set(rows.flatMap(x=>x.rows.map(r=>r.date)))].sort();
 return{
  tooltip:{trigger:"axis"},legend:{top:0},grid:{left:48,right:18,top:30,bottom:40},
  xAxis:{type:"category",data:dates,axisLabel:{fontSize:10}},
  yAxis:{type:"value",axisLabel:{fontSize:10}},
  series:rows.map((x,i)=>({name:x.name,type:"line",smooth:true,symbol:"none",data:dates.map(d=>x.rows.find(r=>r.date===d)?.value||0),lineStyle:{width:2.5,color:["#f48120","#2563eb","#12b76a","#7f56d9"][i%4]}}))
 };
}
function pieOpt(rows){
 rows=(rows||[]).slice(0,8);if(!rows.length)return null;
 return{tooltip:{trigger:"item"},legend:{bottom:0,type:"scroll"},series:[{type:"pie",radius:["45%","72%"],center:["50%","45%"],data:rows.map(x=>({name:String(x.name),value:x.value})),label:{fontSize:11}}]};
}
function list(rows){
 if(!rows?.length)return `<div class="empty">暂无数据</div>`;
 return `<div class="list">${rows.slice(0,10).map(x=>`<div class="row"><span>${esc(x.name)}</span><strong>${typeof x.value==="string"?esc(x.value):fmt(x.value)}</strong></div>`).join("")}</div>`;
}
function notices(warnings){
 if(!warnings?.length)return "";
 return `<div class="notice">${warnings.map(x=>esc(typeof x==="string"?x:`${x.module}: ${x.error}`)).join("<br>")}</div>`;
}
function empty(id,text="暂无可用数据"){
 const e=document.getElementById(id);if(e)e.innerHTML=`<div class="empty">${esc(text)}</div>`;
}
function renderTabs(){
 $("#tabs").innerHTML=Object.entries(T).map(([k,v])=>`<button class="tab ${S.tab===k?"active":""}" data-tab="${k}" title="${esc(v.desc)}"><span class="tab-dot"></span><span>${v.label}</span></button>`).join("")+`<span class="tab-separator"></span><button class="tab tab-refresh" id="refresh" type="button" title="刷新当前页"><span class="tab-dot"></span><span>刷新</span></button>`;
 $("#tabs").onclick=e=>{
  const b=e.target.closest(".tab");if(!b)return;
  S.tab=b.dataset.tab;localStorage.setItem("cf-tab",S.tab);renderTabs();renderCurrent();
 };
}
async function loadInventory(){
 const d=S.cache.inventory||await api("/api/inventory");
 S.cache.inventory=d;
 const z=$("#zone");z.innerHTML=(d.resources.zones||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
 return d;
}
function syncControls(){
 $("#ranges").style.display=S.tab==="overview"?"none":"flex";
 $("#zone").hidden=S.tab!=="zone";
}
async function renderCurrent(force=false){
 syncControls();dispose();load();setState("加载中…");
 try{
  if(force)delete S.cache[S.tab];
  if(S.tab==="overview")await renderOverview();
  else if(S.tab==="zone")await renderZone();
  else{
   const d=S.cache[S.tab]||await api(`/api/${S.tab}?days=${S.days}`);
   S.cache[S.tab]=d;window.__cf=d;renderProduct(S.tab,d);
  }
  setState(`已更新 · ${new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`);
 }catch(e){
  $("#content").innerHTML=`<div class="error"><b>${esc(label(S.tab))}加载失败</b><br><br>${esc(e.message)}<br><br>请检查 API Token 权限、Account ID，以及当前账户是否开通对应 Analytics 数据集。</div>`;
  setState("加载失败");
 }
}
async function renderOverview(){
 const d=await loadInventory(),c=d.counts||{};
 const resources=[
  {key:"zones",name:"网站",count:c.zones||0,desc:"可监控的 Cloudflare Zone"},
  {key:"workers",name:"Workers",count:c.workers||0,desc:"账户下的 Worker 脚本"},
  {key:"d1",name:"D1 数据库",count:c.d1||0,desc:"可用的 D1 数据库"},
  {key:"kv",name:"KV 存储",count:c.kv||0,desc:"KV Namespace 资源"},
  {key:"r2",name:"R2 对象存储",count:c.r2||0,desc:"R2 Bucket 资源"},
  {key:"durableObjects",name:"Durable Objects",count:c.durableObjects||0,desc:"Durable Objects Namespace"}
 ];
 const total=resources.reduce((n,x)=>n+x.count,0);
 const active=resources.filter(x=>x.count>0).length;
 const rows=resources.map(x=>`<div class="resource-row"><div><div class="resource-name">${x.name}</div><div class="resource-desc">${x.desc}</div></div><div class="resource-right"><strong>${fmt(x.count)}</strong><span class="status-dot"><i></i>已发现</span></div></div>`).join("");
 $("#content").innerHTML=`
 <section class="hero"><div class="hero-title">ACCOUNT OVERVIEW</div>
 <div class="hero-main"><div><h2>资源总览</h2><div class="hero-desc">账户下的 Cloudflare 资源与监控范围</div></div><div class="hero-note">仅加载资源清单，不预加载 Analytics</div></div></section>
 ${notices(d.warnings)}
 ${metrics([
  ["Zones",fmt(c.zones),"网站资源"],["Workers",fmt(c.workers),"Worker 脚本"],["D1",fmt(c.d1),"数据库"],
  ["KV",fmt(c.kv),"Namespace"],["R2 Buckets",fmt(c.r2),"对象存储"],["Durable Objects",fmt(c.durableObjects),"Namespace"]
 ])}
 <section class="card overview-status">
  <div class="card-head"><div><div class="card-title">监控范围</div><div class="card-note">当前账户已发现的资源，不代表资源运行状态</div></div></div>
  <div class="overview-summary"><div><strong>${fmt(total)}</strong><span>资源总数</span></div><div><strong>${fmt(active)}</strong><span>已启用产品</span></div><div><strong>${fmt(Object.keys(T).length-1)}</strong><span>可监控产品</span></div></div>
  <div class="resource-list">${rows}</div>
 </section>`;
}
async function renderZone(){
 const inv=await loadInventory(),zones=inv.resources.zones||[];
 $("#zone").hidden=false;
 if(!$("#zone").value&&zones.length)$("#zone").value=zones[0].id;
 if(!zones.length){
  $("#content").innerHTML=`<div class="error">当前账户没有可用 Zone。</div>`;return;
 }
 const id=$("#zone").value;
 const key=`zone:${id}:${S.days}`;
 const d=S.cache[key]||await api(`/api/zone?zone=${encodeURIComponent(id)}&days=${S.days}`);
 S.cache[key]=d;
 $("#content").innerHTML=`
 <section class="hero"><div class="hero-title">WEBSITE ANALYTICS</div>
 <div class="hero-main"><div><h2>${esc(zones.find(x=>x.id===id)?.name||"Zone")}</h2><div class="hero-desc">访问流量、缓存、地域与状态码</div></div><div class="hero-note">${S.days} 天</div></div></section>
 ${notices(d.warnings)}
 ${metrics([
  ["请求数",fmt(d.requests)],["流量",bytes(d.bytes)],["访问",fmt(d.visits)],
  ["缓存命中",fmt(d.cacheHits)],["安全事件",fmt(d.firewall)],["时间范围",`${S.days} 天`]
 ])}
 <div class="grid charts">
  ${card("请求趋势","zone-req","按小时聚合",true)}
  ${card("传输趋势","zone-bytes","Edge Response Bytes",true)}
  ${pieCard("国家/地区","zone-country")}
  ${pieCard("状态码","zone-status")}
  ${pieCard("数据中心","zone-colo")}
  ${pieCard("设备","zone-device")}
  ${pieCard("安全事件趋势","zone-fw", "Firewall Events",true)}
  ${pieCard("拦截动作","zone-fw-action")}
 </div>`;
 chart("zone-req",lineOpt(d.trend,"Requests"));
 chart("zone-bytes",lineOpt(d.bytesTrend,"Bytes"));
 chart("zone-country",pieOpt(d.countries));
 chart("zone-status",pieOpt(d.statuses));
 chart("zone-colo",pieOpt(d.colos));
 chart("zone-device",pieOpt(d.devices));
 chart("zone-fw",lineOpt(d.firewallTrend,"Events"));
 chart("zone-fw-action",pieOpt(d.firewallActions));
}
function renderProduct(tab,d){
 $("#zone").hidden=true;
 const common={
 workers:[
  ["请求",fmt(d.requests)],["错误",fmt(d.errors)],["子请求",fmt(d.subrequests)],
  ["CPU P50",fmt(d.cpuP50)],["内存 P50",bytes(d.memoryP50)],["内存 P99",bytes(d.memoryP99)]
 ],
 d1:[
  ["读取查询",fmt(d.readQueries)],["写入查询",fmt(d.writeQueries)],["读取行数",fmt(d.rowsRead)],
  ["写入行数",fmt(d.rowsWritten)],["响应数据",bytes(d.responseBytes)],["存储",bytes(d.storage)]
 ],
 kv:[
  ["总操作",fmt(d.operations)],["读取",fmt(d.reads)],["写入",fmt(d.writes)],
  ["删除",fmt(d.deletes)],["存储",bytes(d.storage)],["Key 数",fmt(d.keys)]
 ],
 r2:[
  ["操作",fmt(d.operations)],["对象",fmt(d.objects)],["上传",fmt(d.uploads)],
  ["对象数据",bytes(d.storage)],["Metadata",bytes(d.metadata)],["时间范围",`${S.days} 天`]
 ],
 do:[
  ["请求",fmt(d.requests)],["子请求",fmt(d.subrequests)],["CPU",fmt(d.cpu)+" ms"],
  ["存储",bytes(d.storage)],["内存 P50",bytes(d.memoryP50)],["内存 P99",bytes(d.memoryP99)]
 ],
 }[tab]||[];
 let body=metrics(common);
 if(tab==="workers")body+=`<div class="grid charts">${card("请求趋势","p1","按小时",true)}${card("错误趋势","p2","按小时",true)}${pieCard("脚本请求","p3")}${pieCard("状态分布","p4")}${card("内存趋势","p5","P50",true)}</div>`;
 if(tab==="d1")body+=`<div class="grid charts">${card("查询趋势","p1","读 + 写",true)}${card("读取/写入行数","p2","按天",true)}${card("查询延迟","p3","P90",true)}${card("数据库读取","p4")}${card("存储趋势","p5","Database Size",true)}</div>`;
 if(tab==="kv")body+=`<div class="grid charts">${card("操作趋势","p1","按天",true)}${card("存储趋势","p2","Byte Count",true)}${card("Key 趋势","p3","Key Count",true)}${pieCard("操作类型","p4")}${pieCard("Namespace","p5")}</div>`;
 if(tab==="r2")body+=`<div class="grid charts">${card("请求趋势","p1","按小时",true)}${card("存储趋势","p2","Payload Size",true)}${card("对象趋势","p3","Object Count",true)}${pieCard("操作类型","p4")}${pieCard("状态码","p5")}${pieCard("Bucket","p6")}</div>`;
 if(tab==="do")body+=`<div class="grid charts">${card("请求趋势","p1","按天",true)}${card("内存趋势","p2","P50",true)}${card("CPU 趋势","p3","CPU Time",true)}${card("存储趋势","p4","Stored Bytes",true)}</div>`;

 $("#content").innerHTML=`<section class="hero"><div class="hero-title">${tab.toUpperCase()}</div><div class="hero-main"><div><h2>${T[tab].label}</h2><div class="hero-desc">${T[tab].desc}</div></div><div class="hero-note">${S.days} 天 · 按需加载</div></div></section>${notices(d.warnings)}${body}`;
 if(tab==="workers"){
  chart("p1",lineOpt(d.trend,"Requests"));chart("p2",lineOpt(d.errorTrend,"Errors"));chart("p3",pieOpt(d.scripts));chart("p4",pieOpt(d.statuses));chart("p5",lineOpt(d.memoryTrend,"Memory P50"));
 }
 if(tab==="d1"){
  chart("p1",lineOpt(d.queryTrend,"Queries"));chart("p2",multiLine([{name:"Rows Read",rows:d.readTrend},{name:"Rows Written",rows:d.writeTrend}]));chart("p3",lineOpt(d.latencyTrend,"P90"));chart("p4",pieOpt(d.databases));chart("p5",lineOpt(d.storageTrend,"Storage"));
 }
 if(tab==="kv"){
  chart("p1",lineOpt(d.trend,"Operations"));chart("p2",lineOpt(d.storageTrend,"Bytes"));chart("p3",lineOpt(d.keyTrend,"Keys"));chart("p4",pieOpt(d.actions));chart("p5",pieOpt(d.namespaces));
 }
 if(tab==="r2"){
  chart("p1",lineOpt(d.trend,"Requests"));chart("p2",lineOpt(d.storageTrend,"Payload"));chart("p3",lineOpt(d.objectsTrend,"Objects"));chart("p4",pieOpt(d.actions));chart("p5",pieOpt(d.statuses));chart("p6",pieOpt(d.buckets));
 }
 if(tab==="do"){
  chart("p1",lineOpt(d.trend,"Requests"));chart("p2",lineOpt(d.memoryTrend,"Memory P50"));chart("p3",lineOpt(d.cpuTrend,"CPU"));chart("p4",lineOpt(d.storageTrend,"Storage"));
 }

}
$("#ranges").onclick=e=>{
 const b=e.target.closest(".range");if(!b)return;
 S.days=Number(b.dataset.days);localStorage.setItem("cf-days-v7",S.days);
 document.querySelectorAll(".range").forEach(x=>x.classList.toggle("active",x===b));
 S.cache={};renderCurrent();
};
$("#zone").onchange=()=>renderCurrent(true);
$("#tabs").addEventListener("click",e=>{if(e.target.closest("#refresh")){S.cache={};renderCurrent(true)}});
$("#theme").onclick=()=>{
 const dark=!document.documentElement.classList.contains("dark");
 document.documentElement.classList.toggle("dark",dark);
 localStorage.setItem("cf-theme",dark?"dark":"light");
};
if(localStorage.getItem("cf-theme")==="dark")document.documentElement.classList.add("dark");
renderTabs();
document.querySelectorAll(".range").forEach(x=>x.classList.toggle("active",Number(x.dataset.days)===S.days));
renderCurrent();
</script>
</body>
</html>
