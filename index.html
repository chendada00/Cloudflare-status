<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloudflare Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root{
 --bg:#f5f7fb;--surface:#fff;--surface2:#f8fafc;--text:#172033;--muted:#667085;
 --line:#e6eaf0;--accent:#f48120;--accent2:#fb923c;--good:#12b76a;--bad:#f04438;
 --shadow:0 12px 34px rgba(16,24,40,.07);--radius:18px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
body{background:linear-gradient(180deg,#f9fafb 0,#f3f6fa 100%)}
button,select{font:inherit}
button{cursor:pointer}
.shell{max-width:1500px;margin:auto;padding:18px}
.top{
 display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:14px
}
.brand{display:flex;align-items:center;gap:13px}
.brand-mark{width:42px;height:42px;border-radius:13px;background:#f48120;color:white;display:grid;place-items:center;font-weight:900;box-shadow:0 10px 24px rgba(244,129,32,.25)}
.brand h1{font-size:21px;margin:0;font-weight:720;letter-spacing:-.02em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:#344054;border-radius:11px;padding:9px 12px;font-weight:650}
.btn:hover{border-color:#cfd6df;background:#fbfcfd}
.btn.primary{background:#172033;color:#fff;border-color:#172033}
.nav{
 display:flex;align-items:center;gap:5px;overflow:auto;padding:5px;margin-bottom:12px;
 border:1px solid var(--line);background:rgba(255,255,255,.88);border-radius:15px;box-shadow:var(--shadow);
 scrollbar-width:none
}
.nav::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:#667085;padding:9px 13px;border-radius:10px;white-space:nowrap;font-size:13px;font-weight:650}
.tab:hover{background:#f5f7fa;color:#172033}
.tab.active{background:#172033;color:#fff}
.controls{
 display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
 padding:11px 12px;border:1px solid var(--line);background:var(--surface);border-radius:15px;margin-bottom:15px
}
.ranges{display:flex;gap:5px}
.range{border:0;background:transparent;color:#667085;border-radius:9px;padding:7px 11px;font-weight:700;font-size:12px}
.range.active{background:#f2f4f7;color:#172033}
select{min-width:260px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;color:#344054}
.state{font-size:12px;color:#98a2b3}
.hero{
 background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;
 margin-bottom:14px;box-shadow:var(--shadow)
}
.hero-title{font-size:12px;color:#98a2b3;font-weight:700;letter-spacing:.12em}
.hero-main{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-top:7px}
.hero h2{font-size:26px;margin:0;letter-spacing:-.03em}
.hero-note{font-size:12px;color:#98a2b3}
.grid{display:grid;gap:12px}
.metrics{grid-template-columns:repeat(6,minmax(0,1fr))}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow);min-width:0}
.metric-label{font-size:12px;color:#667085}
.metric-value{font-size:22px;font-weight:720;margin-top:7px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-sub{font-size:11px;color:#98a2b3;margin-top:4px}
.charts{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card.wide{grid-column:1/-1}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-title{font-size:14px;font-weight:700;margin:0}
.card-note{font-size:11px;color:#98a2b3;margin-top:3px}
.chart{height:300px;margin-top:7px}
.pie{height:300px}
.list{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 10px;border-radius:10px;background:var(--surface2);font-size:12px}
.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row strong{font-weight:700}
.notice{padding:11px 13px;border-radius:12px;background:#fff8ed;border:1px solid #fed7aa;color:#9a4d08;font-size:12px;margin-bottom:12px}
.error{padding:18px;border-radius:15px;background:#fff5f5;border:1px solid #fecaca;color:#b42318;font-size:13px}
.empty{height:280px;display:grid;place-items:center;color:#98a2b3;font-size:13px}
.loading{height:110px;border-radius:15px;background:linear-gradient(90deg,#eef1f5 25%,#f8fafc 50%,#eef1f5 75%);background-size:200% 100%;animation:load 1.15s infinite}
.loading.chart-load{height:320px}
@keyframes load{to{background-position:-200% 0}}
.footer{text-align:center;color:#98a2b3;font-size:11px;padding:18px}
.theme{position:fixed;right:18px;bottom:18px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 12px;box-shadow:var(--shadow)}
html.dark{
 --bg:#0b1018;--surface:#121a26;--surface2:#182231;--text:#edf2f7;--muted:#98a2b3;--line:#263244;
 --shadow:0 16px 38px rgba(0,0,0,.22)
}
html.dark body{background:#0b1018}
html.dark .nav,html.dark .controls{background:rgba(18,26,38,.94)}
html.dark .btn,html.dark select{background:#121a26;color:#edf2f7;border-color:#263244}
html.dark .tab:hover,html.dark .range.active{background:#1c2736;color:#fff}
html.dark .tab.active,.html.dark .btn.primary{background:#fff;color:#111827}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){
 .shell{padding:10px}.top{align-items:flex-start}.brand h1{font-size:18px}
 .actions .btn:first-child{display:none}.metrics,.charts{grid-template-columns:1fr}
 .card.wide{grid-column:auto}.hero-main{display:block}.hero-note{margin-top:8px}
 select{width:100%;min-width:0}.controls{align-items:stretch}
 .theme{right:10px;bottom:10px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="brand-mark">CF</div>
      <div>
        <h1>Cloudflare Monitor</h1>
        <p id="subtitle">Account 资源与运行状态</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="refresh">↻ 刷新</button>
      <button class="btn primary" id="theme">☾</button>
    </div>
  </header>

  <nav class="nav" id="tabs"></nav>

  <section class="controls">
    <div class="ranges" id="ranges">
      <button class="range active" data-days="1">24 小时</button>
      <button class="range" data-days="7">7 天</button>
      <button class="range" data-days="14">14 天</button>
      <button class="range" data-days="30">30 天</button>
    </div>
    <select id="zone" hidden></select>
    <span class="state" id="state">准备就绪</span>
  </section>

  <main id="content"></main>
  <footer class="footer">Cloudflare Monitor · GraphQL Analytics</footer>
</div>

<script>
const T={
 overview:"概览",zone:"网站 / Zone",workers:"Workers",d1:"D1",kv:"KV",r2:"R2",
 do:"Durable Objects",queues:"Queues",workflows:"Workflows"
};
const S={
 tab:localStorage.getItem("cf-tab")||"overview",
 days:Number(localStorage.getItem("cf-days-v7")||1),
 cache:{},charts:[]
};
const $=s=>document.querySelector(s);
const fmt=n=>new Intl.NumberFormat("zh-CN",{maximumFractionDigits:2}).format(Number(n||0));
const bytes=n=>{
 n=Number(n||0);const u=["B","KB","MB","GB","TB","PB"];let i=0;
 while(n>=1024&&i<u.length-1){n/=1024;i++}return fmt(n)+" "+u[i]
};
const ms=n=>Number(n||0).toFixed(1)+" ms";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(path){
 const r=await fetch(path,{cache:"no-store"});
 const d=await r.json().catch(()=>({}));
 if(!r.ok||!d.success)throw Error(d.error||"请求失败");
 return d.data;
}
function setState(s){$("#state").textContent=s}
function dispose(){
 S.charts.forEach(x=>{try{x.dispose()}catch{}});
 S.charts=[];
}
function load(){
 $("#content").innerHTML=`<div class="grid metrics">${Array.from({length:6},()=>`<div class="loading"></div>`).join("")}</div>
 <div class="grid charts"><div class="loading chart-load"></div><div class="loading chart-load"></div></div>`;
}
function metrics(items){
 return `<div class="grid metrics">${items.map(x=>`<div class="metric">
 <div class="metric-label">${x[0]}</div><div class="metric-value">${x[1]}</div><div class="metric-sub">${x[2]||""}</div>
 </div>`).join("")}</div>`;
}
function card(title,id,note="",wide=false){
 return `<section class="card ${wide?"wide":""}">
 <div class="card-head"><div><div class="card-title">${title}</div>${note?`<div class="card-note">${note}</div>`:""}</div></div>
 <div class="chart" id="${id}"></div></section>`;
}
function pieCard(title,id){return card(title,id,"Top N")}
function chart(id,opt){
 requestAnimationFrame(()=>{
  const el=document.getElementById(id);if(!el)return;
  const c=echarts.init(el);S.charts.push(c);c.setOption(opt,{notMerge:true});
  const ro=new ResizeObserver(()=>c.resize());ro.observe(el);c.__ro=ro;
 });
}
function lineOpt(rows,name="请求"){
 rows=rows||[];if(!rows.length)return null;
 return{
  tooltip:{trigger:"axis"},grid:{left:48,right:18,top:25,bottom:40},
  xAxis:{type:"category",data:rows.map(x=>String(x.date).replace("T"," ").slice(0,16)),axisLabel:{fontSize:10}},
  yAxis:{type:"value",axisLabel:{fontSize:10}},
  series:[{name,type:"line",smooth:true,symbol:"none",data:rows.map(x=>x.value||0),lineStyle:{width:2.5,color:"#f48120"},areaStyle:{opacity:.12,color:"#f48120"}}]
 };
}
function multiLine(a){
 const rows=a.filter(x=>x.rows?.length);if(!rows.length)return null;
 const dates=[...new Set(rows.flatMap(x=>x.rows.map(r=>r.date)))].sort();
 return{
  tooltip:{trigger:"axis"},legend:{top:0},grid:{left:48,right:18,top:30,bottom:40},
  xAxis:{type:"category",data:dates,axisLabel:{fontSize:10}},
  yAxis:{type:"value",axisLabel:{fontSize:10}},
  series:rows.map((x,i)=>({name:x.name,type:"line",smooth:true,symbol:"none",data:dates.map(d=>x.rows.find(r=>r.date===d)?.value||0),lineStyle:{width:2.5,color:["#f48120","#2563eb","#12b76a","#7f56d9"][i%4]}}))
 };
}
function pieOpt(rows){
 rows=(rows||[]).slice(0,8);if(!rows.length)return null;
 return{tooltip:{trigger:"item"},legend:{bottom:0,type:"scroll"},series:[{type:"pie",radius:["45%","72%"],center:["50%","45%"],data:rows.map(x=>({name:String(x.name),value:x.value})),label:{fontSize:11}}]};
}
function list(rows){
 if(!rows?.length)return `<div class="empty">暂无数据</div>`;
 return `<div class="list">${rows.slice(0,10).map(x=>`<div class="row"><span>${esc(x.name)}</span><strong>${fmt(x.value)}</strong></div>`).join("")}</div>`;
}
function notices(warnings){
 if(!warnings?.length)return "";
 return `<div class="notice">${warnings.map(x=>esc(typeof x==="string"?x:`${x.module}: ${x.error}`)).join("<br>")}</div>`;
}
function empty(id,text="暂无可用数据"){
 const e=document.getElementById(id);if(e)e.innerHTML=`<div class="empty">${esc(text)}</div>`;
}
function renderTabs(){
 $("#tabs").innerHTML=Object.entries(T).map(([k,v])=>`<button class="tab ${S.tab===k?"active":""}" data-tab="${k}">${v}</button>`).join("");
 $("#tabs").onclick=e=>{
  const b=e.target.closest(".tab");if(!b)return;
  S.tab=b.dataset.tab;localStorage.setItem("cf-tab",S.tab);renderTabs();renderCurrent();
 };
}
async function loadInventory(){
 const d=S.cache.inventory||await api("/api/inventory");
 S.cache.inventory=d;
 const z=$("#zone");z.innerHTML=(d.resources.zones||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
 return d;
}
async function renderCurrent(force=false){
 dispose();load();setState("加载中…");
 try{
  if(force)delete S.cache[S.tab];
  if(S.tab==="overview")await renderOverview();
  else if(S.tab==="zone")await renderZone();
  else{
   const d=S.cache[S.tab]||await api(`/api/${S.tab}?days=${S.days}`);
   S.cache[S.tab]=d;window.__cf=d;renderProduct(S.tab,d);
  }
  setState(`已更新 · ${new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`);
 }catch(e){
  $("#content").innerHTML=`<div class="error"><b>${esc(T[S.tab])}加载失败</b><br><br>${esc(e.message)}<br><br>请检查 API Token 权限、Account ID，以及当前账户是否开通对应 Analytics 数据集。</div>`;
  setState("加载失败");
 }
}
async function renderOverview(){
 const d=await loadInventory(),c=d.counts||{};
 $("#content").innerHTML=`
 <section class="hero"><div class="hero-title">ACCOUNT OVERVIEW</div>
 <div class="hero-main"><h2>资源总览</h2><div class="hero-note">只请求资源列表，不预加载各产品 Analytics</div></div></section>
 ${notices(d.warnings)}
 ${metrics([
  ["Zones",fmt(c.zones)],["Workers",fmt(c.workers)],["D1",fmt(c.d1)],["KV",fmt(c.kv)],
  ["R2 Buckets",fmt(c.r2)],["Durable Objects",fmt(c.durableObjects)]
 ])}
 <div class="grid charts">
  ${card("资源分布","overview-pie","当前账户资源数量")}
  ${card("其他资源","overview-list","Queues / Workflows")}
 </div>`;
 chart("overview-pie",pieOpt([
  {name:"Zones",value:c.zones},{name:"Workers",value:c.workers},{name:"D1",value:c.d1},
  {name:"KV",value:c.kv},{name:"R2",value:c.r2},{name:"DO",value:c.durableObjects}
 ]));
 $("#overview-list").innerHTML=list([{name:"Queues",value:c.queues},{name:"Workflows",value:c.workflows}]);
}
async function renderZone(){
 const inv=await loadInventory(),zones=inv.resources.zones||[];
 $("#zone").hidden=false;
 if(!$("#zone").value&&zones.length)$("#zone").value=zones[0].id;
 if(!zones.length){
  $("#content").innerHTML=`<div class="error">当前账户没有可用 Zone。</div>`;return;
 }
 const id=$("#zone").value;
 const key=`zone:${id}:${S.days}`;
 const d=S.cache[key]||await api(`/api/zone?zone=${encodeURIComponent(id)}&days=${S.days}`);
 S.cache[key]=d;
 $("#content").innerHTML=`
 <section class="hero"><div class="hero-title">ZONE ANALYTICS</div>
 <div class="hero-main"><h2>${esc(zones.find(x=>x.id===id)?.name||"Zone")}</h2><div class="hero-note">HTTP Analytics + Firewall Events</div></div></section>
 ${notices(d.warnings)}
 ${metrics([
  ["请求数",fmt(d.requests)],["流量",bytes(d.bytes)],["访问",fmt(d.visits)],
  ["缓存命中",fmt(d.cacheHits)],["安全事件",fmt(d.firewall)],["时间范围",`${S.days} 天`]
 ])}
 <div class="grid charts">
  ${card("请求趋势","zone-req","按小时聚合",true)}
  ${card("传输趋势","zone-bytes","Edge Response Bytes",true)}
  ${pieCard("国家/地区","zone-country")}
  ${pieCard("状态码","zone-status")}
  ${pieCard("数据中心","zone-colo")}
  ${pieCard("设备","zone-device")}
  ${pieCard("安全事件趋势","zone-fw", "Firewall Events",true)}
  ${pieCard("拦截动作","zone-fw-action")}
 </div>`;
 chart("zone-req",lineOpt(d.trend,"Requests"));
 chart("zone-bytes",lineOpt(d.bytesTrend,"Bytes"));
 chart("zone-country",pieOpt(d.countries));
 chart("zone-status",pieOpt(d.statuses));
 chart("zone-colo",pieOpt(d.colos));
 chart("zone-device",pieOpt(d.devices));
 chart("zone-fw",lineOpt(d.firewallTrend,"Events"));
 chart("zone-fw-action",pieOpt(d.firewallActions));
}
function renderProduct(tab,d){
 $("#zone").hidden=true;
 const common={
 workers:[
  ["请求",fmt(d.requests)],["错误",fmt(d.errors)],["子请求",fmt(d.subrequests)],
  ["CPU P50",fmt(d.cpuP50)],["内存 P50",bytes(d.memoryP50)],["内存 P99",bytes(d.memoryP99)]
 ],
 d1:[
  ["读取查询",fmt(d.readQueries)],["写入查询",fmt(d.writeQueries)],["读取行数",fmt(d.rowsRead)],
  ["写入行数",fmt(d.rowsWritten)],["响应数据",bytes(d.responseBytes)],["存储",bytes(d.storage)]
 ],
 kv:[
  ["总操作",fmt(d.operations)],["读取",fmt(d.reads)],["写入",fmt(d.writes)],
  ["删除",fmt(d.deletes)],["存储",bytes(d.storage)],["Key 数",fmt(d.keys)]
 ],
 r2:[
  ["操作",fmt(d.operations)],["对象",fmt(d.objects)],["上传",fmt(d.uploads)],
  ["对象数据",bytes(d.storage)],["Metadata",bytes(d.metadata)],["时间范围",`${S.days} 天`]
 ],
 do:[
  ["请求",fmt(d.requests)],["子请求",fmt(d.subrequests)],["CPU",fmt(d.cpu)+" ms"],
  ["存储",bytes(d.storage)],["内存 P50",bytes(d.memoryP50)],["内存 P99",bytes(d.memoryP99)]
 ],
 queues:[
  ["平均积压",fmt(d.backlog)],["积压字节",bytes(d.backlogBytes)],["并发",fmt(d.concurrency)],
  ["操作数",fmt(d.operations)],["操作字节",bytes(d.operationBytes)],["队列数",fmt(d.queues?.length)]
 ],
 workflows:[
  ["启动",fmt(d.runs)],["成功",fmt(d.success)],["失败",fmt(d.failures)],
  ["总耗时",fmt(d.wallTime)+" ms"],["Workflow 数",fmt(d.workflowList?.length)],["时间范围",`${S.days} 天`]
 ]
 }[tab]||[];
 let body=metrics(common);
 if(tab==="workers")body+=`<div class="grid charts">${card("请求趋势","p1","按小时",true)}${card("错误趋势","p2","按小时",true)}${pieCard("脚本请求","p3")}${pieCard("状态分布","p4")}${card("内存趋势","p5","P50",true)}</div>`;
 if(tab==="d1")body+=`<div class="grid charts">${card("查询趋势","p1","读 + 写",true)}${card("读取/写入行数","p2","按天",true)}${card("查询延迟","p3","P90",true)}${card("数据库读取","p4")}${card("存储趋势","p5","Database Size",true)}</div>`;
 if(tab==="kv")body+=`<div class="grid charts">${card("操作趋势","p1","按天",true)}${card("存储趋势","p2","Byte Count",true)}${card("Key 趋势","p3","Key Count",true)}${pieCard("操作类型","p4")}${pieCard("Namespace","p5")}</div>`;
 if(tab==="r2")body+=`<div class="grid charts">${card("请求趋势","p1","按小时",true)}${card("存储趋势","p2","Payload Size",true)}${card("对象趋势","p3","Object Count",true)}${pieCard("操作类型","p4")}${pieCard("状态码","p5")}${pieCard("Bucket","p6")}</div>`;
 if(tab==="do")body+=`<div class="grid charts">${card("请求趋势","p1","按天",true)}${card("内存趋势","p2","P50",true)}${card("CPU 趋势","p3","CPU Time",true)}${card("存储趋势","p4","Stored Bytes",true)}${pieCard("Namespace","p5")}</div>`;
 if(tab==="queues")body+=`<div class="grid charts">${card("积压趋势","p1","Messages",true)}${card("消费者并发","p2", "Concurrency",true)}${card("操作趋势","p3","按分钟",true)}${pieCard("操作类型","p4")}${pieCard("队列使用量","p5")}</div>`;
 if(tab==="workflows")body+=`<div class="grid charts">${card("事件趋势","p1","按小时",true)}${pieCard("事件类型","p2")}${pieCard("Workflow","p3")}${d.workflowList?.length?`<section class="card"><div class="card-title">Workflow 列表</div>${list(d.workflowList.map(x=>({name:x.name,value:""})))}</section>`:""}</div>`;
 $("#content").innerHTML=`<section class="hero"><div class="hero-title">${tab.toUpperCase()}</div><div class="hero-main"><h2>${T[tab]}</h2><div class="hero-note">数据按当前时间范围按需加载</div></div></section>${notices(d.warnings)}${body}`;
 if(tab==="workers"){
  chart("p1",lineOpt(d.trend,"Requests"));chart("p2",lineOpt(d.errorTrend,"Errors"));chart("p3",pieOpt(d.scripts));chart("p4",pieOpt(d.statuses));chart("p5",lineOpt(d.memoryTrend,"Memory P50"));
 }
 if(tab==="d1"){
  chart("p1",lineOpt(d.queryTrend,"Queries"));chart("p2",multiLine([{name:"Rows Read",rows:d.readTrend},{name:"Rows Written",rows:d.writeTrend}]));chart("p3",lineOpt(d.latencyTrend,"P90"));chart("p4",pieOpt(d.databases));chart("p5",lineOpt(d.storageTrend,"Storage"));
 }
 if(tab==="kv"){
  chart("p1",lineOpt(d.trend,"Operations"));chart("p2",lineOpt(d.storageTrend,"Bytes"));chart("p3",lineOpt(d.keyTrend,"Keys"));chart("p4",pieOpt(d.actions));chart("p5",pieOpt(d.namespaces));
 }
 if(tab==="r2"){
  chart("p1",lineOpt(d.trend,"Requests"));chart("p2",lineOpt(d.storageTrend,"Payload"));chart("p3",lineOpt(d.objectsTrend,"Objects"));chart("p4",pieOpt(d.actions));chart("p5",pieOpt(d.statuses));chart("p6",pieOpt(d.buckets));
 }
 if(tab==="do"){
  chart("p1",lineOpt(d.trend,"Requests"));chart("p2",lineOpt(d.memoryTrend,"Memory P50"));chart("p3",lineOpt(d.cpuTrend,"CPU"));chart("p4",lineOpt(d.storageTrend,"Storage"));chart("p5",pieOpt(d.namespaces));
 }
 if(tab==="queues"){
  chart("p1",lineOpt(d.backlogTrend,"Messages"));chart("p2",lineOpt(d.concurrencyTrend,"Concurrency"));chart("p3",lineOpt(d.operationsTrend,"Operations"));chart("p4",pieOpt(d.actions));chart("p5",pieOpt(d.queueUsage));
 }
 if(tab==="workflows"){
  chart("p1",lineOpt(d.trend,"Events"));chart("p2",pieOpt(d.events));chart("p3",pieOpt(d.workflows));
 }
}
$("#ranges").onclick=e=>{
 const b=e.target.closest(".range");if(!b)return;
 S.days=Number(b.dataset.days);localStorage.setItem("cf-days-v7",S.days);
 document.querySelectorAll(".range").forEach(x=>x.classList.toggle("active",x===b));
 S.cache={};renderCurrent();
};
$("#zone").onchange=()=>renderCurrent(true);
$("#refresh").onclick=()=>{S.cache={};renderCurrent(true)};
$("#theme").onclick=()=>{
 const dark=!document.documentElement.classList.contains("dark");
 document.documentElement.classList.toggle("dark",dark);
 localStorage.setItem("cf-theme",dark?"dark":"light");
};
if(localStorage.getItem("cf-theme")==="dark")document.documentElement.classList.add("dark");
renderTabs();
document.querySelectorAll(".range").forEach(x=>x.classList.toggle("active",Number(x.dataset.days)===S.days));
renderCurrent();
</script>
